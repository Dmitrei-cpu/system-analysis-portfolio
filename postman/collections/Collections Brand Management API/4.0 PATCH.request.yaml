$kind: http-request
url: "{{baseUrl}}/posts/1"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: "{\r

    \  \"title\": \"Только заголовок изменён\"\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: beforeRequest
    code: "// Логирование изменяемых полей\r

      const patchData = JSON.parse(pm.request.body.raw);\r

      console.log(\"PATCH изменяет поля:\", Object.keys(patchData));"
    language: text/javascript
  - type: afterResponse
    code: "// Проверка статуса\r

      pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      // Проверка, что изменилось только поле title\r

      pm.test(\"Only title was changed\", function () {\r

      \    const jsonData = pm.response.json();\r

      \    pm.expect(jsonData.title).to.eql(\"Только заголовок изменён\");\r

      });"
    language: text/javascript
settings:
  strictSSL: true
order: 5000
