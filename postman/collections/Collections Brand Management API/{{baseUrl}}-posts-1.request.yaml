$kind: http-request
name: "{{baseUrl}}/posts/1"
url: "{{baseUrl}}/posts/1?userId=1&_limit=5"
method: GET
headers:
  Accept: application/json
  Cache-Control: no-cache
queryParams:
  - key: userId
    value: "1"
    description: Фильтр по пользователю
  - key: _limit
    value: "5"
    description: Лимит записей
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: beforeRequest
    code: "// Логирование времени запроса\r

      console.log(\"GET-запрос отправлен в:\", new Date().toISOString());"
    language: text/javascript
  - type: afterResponse
    code: "// Проверка статуса\r

      pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      // Проверка времени ответа\r

      pm.test(\"Response time < 2000ms\", function () {\r

      \    pm.expect(pm.response.responseTime).to.be.below(2000);\r

      });\r

      \r

      // Проверка структуры ответа\r

      pm.test(\"Response has id and title\", function () {\r

      \    const jsonData = pm.response.json();\r

      \    pm.expect(jsonData).to.have.property(\"id\");\r

      \    pm.expect(jsonData).to.have.property(\"title\");\r

      });\r

      \r

      // Сохранение ID в переменную окружения\r

      const data = pm.response.json();\r

      pm.environment.set(\"postId\", data.id);"
    language: text/javascript
settings:
  strictSSL: true
  followOriginalHttpMethod: true
order: 2000
