$kind: http-request
url: "{{baseUrl}}/posts/1"
method: HEAD
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: beforeRequest
    code: "// HEAD используется для проверки существования ресурса\r

      console.log(\"Проверка существования ресурса HEAD\");"
    language: text/javascript
  - type: afterResponse
    code: "// Проверка статуса\r

      pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      // Проверка, что тело пустое\r

      pm.test(\"Response body is empty\", function () {\r

      \    pm.expect(pm.response.text()).to.be.empty;\r

      });\r

      \r

      // Проверка наличия заголовков\r

      pm.test(\"Response has Content-Type header\", function () {\r

      \    pm.response.to.have.header(\"Content-Type\");\r

      });"
    language: text/javascript
settings:
  strictSSL: true
order: 7000
