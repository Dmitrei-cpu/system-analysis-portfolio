$kind: http-request
name: "{{baseUrl}}/posts/1"
url: "{{baseUrl}}/posts"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: "{\r

    \  \"title\": \"Новый пост системного аналитика\",\r

    \  \"body\": \"Описание проекта: проектирование REST API для маркетплейса\",\r

    \  \"userId\": 1\r

    }"
scripts:
  - type: beforeRequest
    code: "// Генерация уникального заголовка для избежания дублирования\r

      const timestamp = Date.now();\r

      pm.request.headers.add({\r

      \    key: \"X-Request-ID\",\r

      \    value: \"req-\" + timestamp\r

      });\r

      console.log(\"Request ID:\", \"req-\" + timestamp);"
    language: text/javascript
  - type: afterResponse
    code: "// Проверка статуса 201 Created\r

      pm.test(\"Status code is 201\", function () {\r

      \    pm.response.to.have.status(201);\r

      });\r

      \r

      // Проверка создания ресурса\r

      pm.test(\"Resource was created\", function () {\r

      \    const jsonData = pm.response.json();\r

      \    pm.expect(jsonData).to.have.property(\"id\");\r

      \    pm.expect(jsonData.title).to.eql(\"Новый пост системного аналитика\");\r

      });\r

      \r

      // Сохранение созданного ID\r

      const data = pm.response.json();\r

      pm.environment.set(\"createdPostId\", data.id);\r

      console.log(\"Создан пост с ID:\", data.id);"
    language: text/javascript
settings:
  strictSSL: true
order: 3000
