$kind: http-request
url: "{{baseUrl}}/posts"
method: OPTIONS
headers:
  Accept: application/json
scripts:
  - type: beforeRequest
    code: "// OPTIONS используется для CORS-проверок\r

      console.log(\"Запрос доступных методов через OPTIONS\");"
    language: text/javascript
  - type: afterResponse
    code: "// Проверка статуса\r

      pm.test(\"Status code is 200 or 204\", function () {\r

      \    pm.expect(pm.response.code).to.be.oneOf([200, 204]);\r

      });\r

      \r

      // Проверка заголовка Allow\r

      pm.test(\"Response has Allow header\", function () {\r

      \    pm.response.to.have.header(\"Allow\");\r

      });\r

      \r

      // Вывод доступных методов\r

      const allowHeader = pm.response.headers.get(\"Allow\");\r

      console.log(\"Доступные методы:\", allowHeader);"
    language: text/javascript
settings:
  strictSSL: true
order: 8000
