    scripts:
      afterResponse: |-
        insomnia.test('Status code is 200', () => {
          insomnia.expect(insomnia.response.code).to.eql(200);
        });
        insomnia.test('Item was fully updated', () => {
          const data = insomnia.response.json();
          insomnia.expect(data.name).to.eql('Кроссовки Nike Air Max 2025');
          insomnia.expect(data.price).to.eql(8500.00);
        });
        insomnia.test('PUT is idempotent', () => {
          insomnia.expect(insomnia.response.code).to.be.oneOf([200, 204]);
        });
