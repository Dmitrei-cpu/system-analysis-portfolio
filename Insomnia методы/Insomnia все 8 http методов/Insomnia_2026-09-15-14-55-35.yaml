    method: POST
    body:
      mimeType: application/json
      text: |-
        {
          "title": "Новый пост",
          "body": "Описание проекта",
          "userId": 1
        }
    headers:
      - name: Content-Type
        value: application/json
    authentication:
      type: bearer
      token: "{{ _.accessToken }}"
    scripts:
      afterResponse: |-
        // Проверяем статус 201 Created
        insomnia.test('Status code is 201', () => {
          insomnia.expect(insomnia.response.code).to.eql(201);
        });
        // Сохраняем ID созданного поста в переменную окружения
        const response = insomnia.response.json();
        if (response && response.id) {
          insomnia.environment.set('createdPostId', response.id);
        }
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
